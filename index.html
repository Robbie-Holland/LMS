<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RH LMS | Last Man Standing</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 0 auto; padding: 20px; line-height: 1.5; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; }
    button { cursor: pointer; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 10px; margin-bottom: 16px; }
    .muted { color: #666; }
    .ok { color: green; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>RH LMS</h1>
  <p>Deadline: <span id="deadline-text">Loading...</span></p>

  <div class="card">
    <h2>Register</h2>
    <form id="register-form">
      <input id="reg-name" placeholder="Name" required />
      <input id="reg-code" placeholder="Code" required />
      <button type="submit">Register</button>
    </form>
    <div id="register-message"></div>
  </div>

  <div class="card">
    <h2>Make Pick</h2>
    <form id="pick-form">
      <input id="pick-name" placeholder="Name" required />
      <input id="pick-code" placeholder="Code" required />
      <select id="team-select" required>
        <option value="">Loading teams...</option>
      </select>
      <button type="submit">Submit Pick</button>
    </form>
    <div id="pick-message"></div>
  </div>

  <script>
    const API_BASE = 'https://robbie-holland.github.io/LMS/';

    const el = id => document.getElementById(id);
    let state = { settings: {}, teams: [], players: [], picks: [], results: [] };

    async function getData() {
      const res = await fetch(API_BASE + '?action=public');
      const data = await res.json();
      if (!data.ok) throw new Error(data.message || 'Load failed');
      state = data;
      el('deadline-text').textContent = data.settings.deadlineText || 'Set in Google Sheets';
      renderTeams();
      return data;
    }

    async function postData(payload) {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.message || 'Request failed');
      return data;
    }

    function renderTeams() {
      const select = el('team-select');
      if (!select) return;
      const teams = state.teams || [];
      select.innerHTML = '<option value="">Choose a team</option>';
      teams.forEach(team => {
        const opt = document.createElement('option');
        opt.value = team.Team || team.team || '';
        opt.textContent = team.Team || team.team || '';
        select.appendChild(opt);
      });
    }

    function showMessage(id, text, kind) {
      const box = el(id);
      box.className = kind;
      box.textContent = text;
    }

    el('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await postData({
          action: 'register',
          name: el('reg-name').value.trim(),
          code: el('reg-code').value.trim()
        });
        showMessage('register-message', 'Registered successfully.', 'ok');
        e.target.reset();
        await getData();
      } catch (err) {
        showMessage('register-message', err.message, 'error');
      }
    });

    el('pick-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await postData({
          action: 'submitPick',
          name: el('pick-name').value.trim(),
          code: el('pick-code').value.trim(),
          team: el('team-select').value
        });
        showMessage('pick-message', 'Pick submitted successfully.', 'ok');
        e.target.reset();
        await getData();
      } catch (err) {
        showMessage('pick-message', err.message, 'error');
      }
    });

    getData().catch(err => {
      el('deadline-text').textContent = err.message;
    });
  </script>
</body>
</html>
